[project]
name = "wildtunnel"
version = "0.3.5"
description = "Expose a local service to the internet at a wildcard subdomain, tunneled through a VPS running frps. Ships with AWS EC2 and AWS Lightsail providers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dasbd72", email = "twbd723@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
]

[project.optional-dependencies]
aws-ec2 = [
    "aws-cdk-cli>=2.1143.0",
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
]
dashboard = [
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
wildtunnel = "wildtunnel:main"

[dependency-groups]
dev = [
    "boto3-stubs[ssm]>=1.34",
    "httpx2>=2.13.1",
    "moto[ssm]>=5.0",
    "mypy>=1.11",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildtunnel"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "aws_cdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_generics = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "wildtunnel.cli",
    "wildtunnel.providers.aws_ec2.cli",
    "wildtunnel.providers.aws_lightsail.cli",
    "wildtunnel.frpc_cli",
]
implicit_reexport = true
