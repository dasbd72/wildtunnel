[project]
name = "aws-reverse-tunnel"
version = "0.1.0"
description = "Expose a local service to the internet at a wildcard subdomain, tunneled through an AWS EC2 instance running frps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dasbd72", email = "twbd723@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
]

[project.optional-dependencies]
infra = [
    "aws-cdk-cli>=2.1143.0",
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
]

[project.scripts]
aws-reverse-tunnel = "aws_reverse_tunnel:main"

[dependency-groups]
dev = [
    "boto3-stubs[ssm]>=1.34",
    "moto[ssm]>=5.0",
    "mypy>=1.11",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_reverse_tunnel"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "aws_cdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_generics = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["aws_reverse_tunnel.cli", "aws_reverse_tunnel.providers.aws_ec2.cli", "aws_reverse_tunnel.frpc_cli"]
implicit_reexport = true
